<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f5f46" />
    <meta name="description" content="Verdant GIS — premium geospatial data marketplace." />
    <title>Verdant GIS — Geospatial Data Marketplace</title>

    <style>
      /* Initial page loader — visible before React loads */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
      }

      #initial-loader .loader-logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #0f5f46;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 25px;
        font-weight: 700;
        margin-bottom: 22px;
      }

      #initial-loader .loader-name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #0f5f46;
        margin-bottom: 28px;
      }

      #initial-loader .loader-line {
        width: 120px;
        height: 3px;
        background: #e5eee9;
        border-radius: 10px;
        overflow: hidden;
      }

      #initial-loader .loader-line::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #0f5f46;
        border-radius: 10px;
        animation: verdant-loading 1.1s ease-in-out infinite;
      }

      @keyframes verdant-loading {
        0% {
          transform: translateX(-120%);
        }
        50% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>

  <body>
    <!-- Shows immediately while React is loading -->
    <div id="initial-loader">
      <div class="loader-logo">V</div>
      <div class="loader-name">VERDANT GIS</div>
      <div class="loader-line"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
  const removeInitialLoader = () => {
    const loader = document.getElementById("initial-loader");

    if (loader) {
      loader.style.opacity = "0";

      setTimeout(() => {
        loader.remove();
      }, 300);
    }
  };

  const root = document.getElementById("root");

  const observer = new MutationObserver(() => {
    if (root && root.children.length > 0) {
      removeInitialLoader();
      observer.disconnect();
    }
  });

  observer.observe(root, {
    childList: true,
  });

  // Safety fallback: never leave the loading screen stuck forever
  setTimeout(() => {
    removeInitialLoader();
    observer.disconnect();
  }, 15000);
</script>
  </body>
</html>
